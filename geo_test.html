<script>

  const def_center = [35.7270622,139.6227558];
  const the_map = L.map("map").setView(def_center,5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',

  }).addTo(the_map);
  const marker = L.marker(def_center);

marker.bindPopup("hoge",{className:"hoge"})

const geolocation = (()=>{
  let watching = false;
  let watch_id;
  let loading = false;
  let lat = 0;
  let lng = 0;
  const geo_marker = L.circleMarker(def_center,{
    radius:7,
    weight:2,
    color:"#fff",
    fillColor:"#66f",
    fillOpacity:1.0
  });
  let button_container, gps_button, mylocation_button;
  const buttons = L.Control.extend({
    options:{
      position:"bottomright"
    },
    onAdd(){
      button_container = L.DomUtil.create("div", "leaflet-bar leaflet-control");
      mylocation_button = L.DomUtil.create("a", "material-symbols-outlined geo-button geo-button-hidden",button_container);
      gps_button = L.DomUtil.create("a", "material-symbols-outlined geo-button",button_container);
      [gps_button,mylocation_button].forEach(elm=>{
        elm.addEventListener("mousedown", e=>e.stopPropagation());
        elm.addEventListener("click", e=>{
          e.stopPropagation();
          e.preventDefault();
        })
        elm.style.cssText = "font-size:24px;";
      });
      gps_button.innerText = `location_on`;
      gps_button.addEventListener("click",()=>{
        toggle_watch();
      });
      mylocation_button.innerText = `location_searching`;
      mylocation_button.addEventListener("click",()=>{
        moveto_mylocation();
      });
      return button_container;
    }
  });
  const geo_buttons = new buttons();
  the_map.addControl(geo_buttons);

  function toggle_watch(){
    if(!watching){
      start_watch();
    }
    else if(watch_id){
      clear_watch();
    }
  }
  function start_watch(){
    if(watching) return;
    loading = true;
    gps_button.classList.add("geo-button-loading");
    const id = navigator.geolocation.watchPosition(position=>{
      if(loading){
        gps_button.classList.remove("geo-button-loading");
        loading = false;
      }
      watching = true;
      gps_button.classList.add("geo-button-on");
      mylocation_button.classList.remove("geo-button-hidden");
      const c = position.coords;
      if(lat != c.latitude || lng != c.longitude){
        onmove_funcs.forEach(func=>{func([c.latitude, c.longitude],[lat, lng])})
      }
      lat = c.latitude;
      lng = c.longitude;
      geo_marker.addTo(the_map)
      geo_marker.setLatLng([c.latitude,c.longitude]);
      //console.log("watch",this.lat,this.lng,c.accuracy);
    }, err=>{
      if(loading){
        gps_button.classList.remove("geo-button-loading");
        loading = false;
      }
      console.error(err);
    }, {enableHighAccuracy:true});
    watch_id = id;
  }
  function clear_watch(){
    if(!watching) return;
    navigator.geolocation.clearWatch(watch_id);
    gps_button.classList.remove("geo-button-on");
    mylocation_button.classList.add("geo-button-hidden");
    geo_marker.remove();
    watching = false;
    watch_id = null;
  }
  function get_once(moveto_location=false){
    return new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(position=>{
        const c = position.coords;
        lat = c.latitude, lng = c.longitude;
        geo_marker.addTo(the_map);
        geo_marker.setLatLng([c.latitude,c.longitude]);
        if(moveto_location) the_map.panTo([c.latitude,c.longitude]);
        console.log("get",lat,lng,c.accuracy);
        resolve([c.latitude,c.longitude]);
      },err=>{
        reject(err);
      })
    })
  }
  function moveto_mylocation(){
    if(watching){
      the_map.panTo([lat,lng])
    }
  }
  const onmove_funcs = [];
  function onmove(func){
    if(func && typeof func == "function"){
      onmove_funcs.push(func);
    }
  }
  return {
    toggle_watch,
    start_watch,
    clear_watch,
    get_once,
    moveto_mylocation,
    onmove
  }

})();


function create_button({position="topleft", onclick=()=>{}, oninit=()=>{}, text="", src="", elm=null}){
  const button = L.Control.extend({
    options: {
      position:position
    },
    onAdd(map){
      const wrapper = L.DomUtil.create("div", "leaflet-bar leaflet-control");
      const link = L.DomUtil.create("a");
      link.addEventListener("mousedown", e=>{
        e.stopPropagation();
      })
      link.addEventListener("click", e=>{
        e.stopPropagation();
        e.preventDefault();
        onclick(e);
      });
      if(elm && elm instanceof HTMLElement){
        link.append(elm);
      }
      else if(src){
        const img = L.DomUtil.create("img");
        img.src=src;
        img.style.cssText = `width:95%;height:95%;object-fit:contain;`
        link.append(img);
      }
      else {
        link.innerText = text;
      }
      wrapper.append(link);
      oninit(link);
      return wrapper;
    }
  });
  return new button();
}
function create_multi_button({position="topleft", attrs=[]}){
  const button = L.Control.extend({
    options: {
      position:position
    },
    onAdd(map){
      const wrapper = L.DomUtil.create("div", "leaflet-bar leaflet-control");
      attrs.forEach(attr=>{
        const {onclick=()=>{}, oninit=()=>{}, text="", src="", elm=null} = attr;
        const link = L.DomUtil.create("a");
        link.addEventListener("mousedown", e=>{
          e.stopPropagation();
        })
        link.addEventListener("click", e=>{
          e.stopPropagation();
          e.preventDefault();
          onclick(e);
        });
        if(elm && elm instanceof HTMLElement){
          link.append(elm);
        }
        else if(src){
          const img = L.DomUtil.create("img");
          img.src=src;
          img.style.cssText = `width:95%;height:95%;object-fit:contain;`
          link.append(img);
        }
        else {
          link.innerText = text;
        }
        wrapper.append(link);
        oninit(link);
      });
      return wrapper;
    }
  });
  return new button();
}

const captureimage = (()=>{
  async function captureimage(map, title_text = "日本列島をダーツで旅するやつ", place_text = "熊本県八代市郡築十一番町に、行ってらっしゃい", latlng){
    const mapelm = the_map.getContainer();
    latlng = (center=>[center.lat, center.lng])(the_map.getCenter());
    /*let canvas = await html2canvas(mapelm, {
      useCORS: true,
      allowTaint: false,
      scale: window.devicePixelRatio || 1, 
      backgroundColor: null,
      logging: false,
      windowWidth:800,
      ignoreElements: (el)=>{
        return el.classList.contains('leaflet-control-container')
          //||el.classList.contains("leaflet-popup");
      }
    });*/

    const target_width = 600;
    const target_height = 800;

    const current_width = mapelm.clientWidth;
    const current_height = mapelm.clientHeight;
    const dx = Math.round((target_width - current_width)/2);
    const dy = Math.round((target_height - current_height)/2);

    let canvas = await domtoimage.toCanvas(mapelm, {
      cacheBust: true,
      width:target_width,
      height:target_height,
      //scale:1.5,
      pixelRatio: window.devicePixelRatio || 1,
      bgcolor: null,
      preserveScroll: true,
      loadExternalStyleSheet:true,
      adjustClonedNode: (node,clone,after)=>{
        if(node.classList && node.classList.contains("leaflet-map-pane")){
          console.log("clone", clone);
          clone.style.translate = `${dx}px ${dy}px`;
          //await new Promise(resolve=>setTimeout(resolve,500));
        }
      },
      filter: (node) => {
        if (node.classList && node.classList.contains('leaflet-control-container')) {
          return false;
        }
        else if(node.src){
          if(/data:image\/png;base64,iVBORw0KGgoAAAANSUhEUgAAACMAAAA/.exec(node.src)){
            return false;
          }
        }
        return true;
      }
    })
    
  //  document.querySelector("#captureoutput").innerHTML="";
  //  document.querySelector("#captureoutput").appendChild(canvas);

    canvas = cropAndResize(canvas, target_width, target_height-24-18);
    canvas = appendBanner(canvas, target_width, target_height, title_text, 24, place_text, 18, latlng, 16);

    document.querySelector("#captureoutput").innerHTML="";
    document.querySelector("#captureoutput").appendChild(canvas);
    
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `map-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png'); 
  }
  function cropAndResize(canvas, targetWidth = 720, targetHeight = 960) {
    const targetRatio = targetWidth / targetHeight; 
    const srcRatio = canvas.width / canvas.height;

    let cropWidth, cropHeight;
    if (srcRatio > targetRatio) { // 元画像が横長すぎる → 高さ基準でクロップ幅を決める
      cropHeight = canvas.height;
      cropWidth = cropHeight * targetRatio;
    } else { // 元画像が縦長すぎる(または一致) → 幅基準でクロップ高さを決める
      cropWidth = canvas.width;
      cropHeight = cropWidth / targetRatio;
    }

    const sx = (canvas.width - cropWidth) / 2;
    const sy = (canvas.height - cropHeight) / 2;

    const outCanvas = document.createElement('canvas');
    outCanvas.width = targetWidth;
    outCanvas.height = targetHeight;

    const ctx = outCanvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    ctx.drawImage(
      canvas,
      sx, sy, cropWidth, cropHeight, // 元画像からの切り取り範囲
      0, 0, targetWidth, targetHeight // 出力先へのリサイズ描画
    );
    return outCanvas;
  }

  function appendBanner(canvas, width=720, height=960, bannerText="日本列島をダーツで旅するやつ", bannerHeight=24, subBannerText="", subBannerHeight=16, latlng, subBannerHeight2=16){
    const newCanvas = document.createElement("canvas");
    newCanvas.width = width;
    newCanvas.height = height;
    if(!subBannerText){
      subBannerHeight = 0;
    }
    if(!latlng){
      subBannerHeight2 = 0;
    }
    const context = newCanvas.getContext("2d");
    context.fillStyle = "#a00";
    context.fillRect(0, 0, width, bannerHeight+subBannerHeight+subBannerHeight2);
    
    context.fillStyle = "#fff";
    context.textAlign = "center";
    context.font = `bold ${Math.round(bannerHeight * 0.8)}px serif`;
    context.fillText(bannerText, width/2, Math.round(bannerHeight * 0.8), width);

    if(subBannerText){
      context.strokeStyle ="#fff";
      const lineLength = Math.round(width * 0.3);
      context.moveTo((width-lineLength)/2, bannerHeight);
      context.lineTo((width-lineLength)/2+lineLength, bannerHeight);
    //  context.stroke();
      context.font = `${Math.round(subBannerHeight * 0.9)-3}px serif`;
      context.fillText(subBannerText, width/2, bannerHeight + Math.round(subBannerHeight * 0.9)-3, width);
    }
    if(latlng){
      context.font = `${Math.round(subBannerHeight2 * 0.9)-3}px serif`;
      context.fillText(`（緯度:${latlng[0].toFixed(6)}, 経度:${latlng[1].toFixed(6)}）`, width/2, bannerHeight + subBannerHeight + Math.round(subBannerHeight2 * 0.9)-3, width);
    }

    context.drawImage(canvas, 0, bannerHeight+subBannerHeight+subBannerHeight2);

    const contribution = "©Openstreetmap Contributors";
    context.font = "12px sans-serif";
    context.textAlign = "left";
    const text_width = context.measureText(contribution).width;

    context.fillStyle = "#fff";
    context.fillRect(width-text_width-2,height-16,text_width+2,16);
    context.fillStyle = "#333";
    context.fillText(contribution, width-text_width-2, height-4);

    return newCanvas;
  }
  return captureimage;
})();





document.addEventListener("alpine:init", ()=>{
  Alpine.data("geo", ()=>({
    watching:false,
    enabled:false,
    lat:0,
    lng:0,
    id:null,
    history:[],
    start_watch(){
      if(this.watching == false){
        const id = navigator.geolocation.watchPosition(position=>{
          this.watching = true;
          this.enabled = true;
          const c = position.coords;
          if(this.lat != c.latitude || this.lng != c.longitude){
            this.history.push([c.latitude,c.longitude]);
          }
          this.lat = c.latitude;
          this.lng = c.longitude;
          marker.setLatLng([c.latitude,c.longitude]);
          the_map.panTo([c.latitude,c.longitude])
          console.log("watch",this.lat,this.lng,c.accuracy);
        }, err=>{
          console.error(err);
          this.enabled = false;
        }, {enableHighAccuracy:true})
        this.id = id;
      }
      else if(this.id){
        navigator.geolocation.clearWatch(this.id);
        this.watching = false;
        this.id = null;
      }
    },
    get_once(){
      navigator.geolocation.getCurrentPosition(position=>{
        const c = position.coords;
        this.lat = c.latitude;
        this.lng = c.longitude;
        marker.setLatLng([c.latitude,c.longitude]);
        the_map.panTo([c.latitude,c.longitude])
        console.log("get",this.lat,this.lng,c.accuracy);
      },err=>{
        console.error(err);
      })
    },
  }));

});


</script>
