<script>
const dart = (()=>{
  const def_center = [35.164828,136.867676];
  const the_map = L.map("map").setView(def_center,5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      crossOrigin: "anonymous",
      edgeBuferTiles: 2
  }).addTo(the_map);
  const center_cross = L.control.centerCross({
    show: true,
    position: "topleft"
  });
  the_map.addControl(center_cross);
  center_cross.getContainer().classList.add("leaflet-center-cross");
  const dart_icon = L.icon({
    iconUrl: "./dart56a.png",
    iconSize: [53,56],
    iconAnchor: [0,55],
    popupAnchor:[38,-38],
    shadowUrl:"./dart56a_shadow.png",
    shadowSize:[56,28],
    shadowAnchor:[0,21]
  })

  const marker = L.marker(def_center, {icon:dart_icon});
  let show_marker = false;
  let the_popup = null;

  function create_googlemaps_url(latlng, zoom=10){
    const lat = parseFloat(latlng[0]).toFixed(8);
    const lng = parseFloat(latlng[1]).toFixed(8);
    zoom = Math.min(Math.max(parseInt(zoom),0),22)+"";
    //return `https://www.google.co.jp/maps/@${lat},${lng},${zoom}z`;
    return `https://www.google.co.jp/maps/place/${encodeURIComponent(lat+","+lng)}/@${lat},${lng},${zoom}z`;
  }
  function create_gsimaps_url(latlng, zoom=10){
    const lat = parseFloat(latlng[0]).toFixed(6);
    const lng = parseFloat(latlng[1]).toFixed(6);
    zoom = Math.min(Math.max(parseInt(zoom),0),22)+"";
    return `https://maps.gsi.go.jp/#${zoom}/${lat}/${lng}/`;
  }
  function create_geouri(latlng, zoom=10){
    const lat = parseFloat(latlng[0]).toFixed(6);
    const lng = parseFloat(latlng[1]).toFixed(6);
    zoom = Math.min(Math.max(parseInt(zoom),0),22)+"";
    return `geo:${lat},${lng}?q=${lat},${lng}&z=${zoom}`;
  }
  function create_share_url(latlng, placeName="（不明な地点）"){
    const lat = parseFloat(latlng[0]).toFixed(8);
    const lng = parseFloat(latlng[1]).toFixed(8);
    return location.origin + location.pathname + `?ll=${lat},${lng}`;
  }
  function create_twitter_share(latlng, placeName="（不明な地点）"){
    const share_url = create_share_url(latlng, placeName);
    const tweet_text = `【ダーツ旅】私は今から${placeName}に行ってきます！\n`;
    return `https://x.com/intent/tweet?text=${encodeURIComponent(tweet_text)}&url=${encodeURIComponent(share_url)}`;
  }
  function create_twitter_arrival_share(latlng, placeName="（不明な地点）"){
    const share_url = create_share_url(latlng, placeName);
    const tweet_text = `【ダーツ旅】私はダーツの刺さった${placeName}に到着しました！！！\n`;
    return `https://x.com/intent/tweet?text=${encodeURIComponent(tweet_text)}&url=${encodeURIComponent(share_url)}`;
  }
  function is_mobile(){
    const mql = window.matchMedia("(max-width: 480px) and (orientation: portrait), (max-height: 480px) and (orientation: landscape)");
    return mql.matches;
  }

  async function put_marker(latlng, nopopup=false){
    if(the_popup){the_popup.closePopup();}
    if(!show_marker){
      marker.addTo(the_map);
      show_marker = true;
    }
    marker.setLatLng(latlng);
    let zoom = 10;
    const current_zoom = the_map.getZoom();
    if(10 < current_zoom && current_zoom < 14){
      zoom = current_zoom;
    }
    the_map.flyTo(latlng, zoom, {animate:true});  
    if(nopopup) return;
    let placeName = "";
    const start_time = Date.now();
    await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${latlng[0]}&lon=${latlng[1]}`)
      .then(resp=>resp.json())
      .then(json=>{
        if(!json.results){
          //console.log("not japan");
          placeName = "（不明な地点）"
        }
        else{
          const muniCd = json.results.muniCd;
          const muni = Muni.get(muniCd);
          if(!muni){
             //console.log("unknown place");
             placeName = "（不明な地点）"
          }
          else{
            const prefName = muni.prefName;
            const muniName = muni.muniName;
            const townName = json.results.lv01Nm;
            placeName = `${prefName}${muniName}${townName=="−"?"":townName}`; //ハイフンではなく全角マイナス（U+2212）
          }
        }
        const new_popup = create_popup({latlng, zoom, placeName});
        const timeout = Math.max(1000-(Date.now()-start_time),0)
        setTimeout(()=>{
          the_popup = marker.bindPopup(new_popup).openPopup();
        }, timeout);
      });
    return {latlng, placeName};
  }
  
  function create_popup({latlng=[0,0], zoom=10, placeName="（不明な地点）", history=false, deletefunc}){
    placeName = placeName.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/　/g,"");
    const urls = `
      <a href="${create_googlemaps_url(latlng, zoom)}" target="_blank">Googleマップ</a><br />
      <a href="${create_gsimaps_url(latlng, zoom)}" target="_blank">地理院地図</a>` + (is_mobile()?`<br />
      <a href="${create_geouri(latlng, zoom)}" target="_blank">アプリを開く</a>
      `:"");
    const shares = `
      <a href="${create_twitter_share(latlng, placeName)}" target="_blank">&#x1D54F;にポスト</a> | 
      <a href="${create_share_url(latlng, placeName)}" target="_blank">共有リンク</a>
      `;

    const popup = L.popup();
    const container = L.DomUtil.create("div","popup-container-elm");
    const mainelm = L.DomUtil.create("div","popup-main", container);
    mainelm.innerHTML = `
      <strong>${placeName}</strong><br />
      に、行ってらっしゃい<br />
      <div class="dart-share_urls">
        ${urls}<br /><br />${shares}
      </div>`;

    const capture_link = document.createElement("a");
    capture_link.href="javascript:void(0)";
    capture_link.innerText="シェア用画像をDL";
    capture_link.addEventListener("click", e=>{
      captureimage(the_map, "日本列島をダーツで旅するやつ", `${placeName}に、行ってらっしゃい`, latlng);
    })
    mainelm.querySelector(".dart-share_urls").append(document.createElement("br"),capture_link);

    const consoleelm = L.DomUtil.create("div","popup-console", container);
    //if(geolocation.is_watching()){
      const checkinbutton = L.DomUtil.create("a","",consoleelm);
      checkinbutton.href="javascript:void(0)";
      checkinbutton.innerText = "この場所に着いた";
      checkinbutton.addEventListener("click",e=>{
        e.preventDefault();
        e.stopPropagation();
        checkin(latlng, zoom, placeName, popup, history);
      })
    //}
    if(history && deletefunc){
      const deletebutton = L.DomUtil.create("span","material-symbols-outlined popup-delete-button",consoleelm);
      deletebutton.innerText="delete";
      deletebutton.addEventListener("click", e=>{
        if(confirm("削除しますか?")){
          deletefunc()
        }
      });
    }
    popup.setContent(container);
    return popup;
  }

  function create_arrival_popup_content({latlng=[0,0], zoom=10, placeName="（不明な地点）", distance=100}){
    placeName = placeName.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/　/g,"");
    const urls = `
      <a href="${create_googlemaps_url(latlng, zoom)}" target="_blank">Googleマップ</a><br />
      <a href="${create_gsimaps_url(latlng, zoom)}" target="_blank">地理院地図</a>` + (is_mobile()?`<br />
      <a href="${create_geouri(latlng, zoom)}" target="_blank">アプリを開く</a>
      `:"");
    const shares = `
      <a href="${create_twitter_arrival_share(latlng, placeName)}" target="_blank">&#x1D54F;に報告</a> | 
      <a href="${create_share_url(latlng, placeName)}" target="_blank">共有リンク</a>
      `;
      
    const container = L.DomUtil.create("div","popup-container-elm");
    const mainelm = L.DomUtil.create("div","popup-main", container);
    mainelm.innerHTML = `
      <div class="arrival-message">
        <strong class="arrival-congrats">Congratulations!</strong><br /><br/>
        <strong>${placeName}</strong><br />に、到着しました!!!!<br />
        <small>（距離：${parseInt((distance*1000))}メートル）</small>
      </div>
      <div class="dart-share_urls">
        ${urls}<br /><br />${shares}
      </div>`;
      
    const capture_link = document.createElement("a");
    capture_link.href="javascript:void(0)";
    capture_link.innerText="シェア用画像をDL";
    capture_link.addEventListener("click", e=>{
      captureimage(the_map, "日本列島をダーツで旅するやつ", `${placeName}に、到着しました！！！！`, latlng);
    })
    mainelm.querySelector(".dart-share_urls").append(document.createElement("br"),capture_link);


    return container;
  }

  function checkin(latlng, zoom, placeName, popup, history){
    geolocation.get_once(false).then(loc=>{
      const dist = utils.distance(loc, latlng);
      if(dist < 0.5){ //500m未満
        console.log("congratulations!");

        const popupElm = popup.getElement();
        popupElm.classList.add("dart-arrival")
        const old_content = popup.getContent();
        popup.once("popupclose", e=>{
          popupElm.classList.remove("dart-arrival");
          popup.setContent(old_content);
        });
        const arrival_popup = create_arrival_popup_content({latlng, zoom, placeName, distance:0.375});
        popup.setContent(arrival_popup);
      }
      else{
        alert(`まだ着いていないようです……\n（距離：${parseInt(dist*1000)}メートル）`);
      }
    }).catch(err=>{
      alert("位置情報を許可してください")
    })
  }

  const utils = {
    getMN(latitude_radian=0){
      const a = 6378.137;
      const f = 1 / 298.257222101;
      const e2 = 2*f - f*f;
      const W = Math.sqrt(1 - e2 * Math.pow(Math.sin(latitude_radian),2));
      const M = a * (1 - e2) / Math.pow(W,3)
      const N = a / W;
      return {M,N};
    },
    deg2rad(deg=0){
      return deg * Math.PI / 180;
    },
    rad2deg(rad=0){
      return rad * 180 / Math.PI;
    },
    distance([lat0=0, lng0=0],[lat1=0, lng1=0]){//latlng -> km
      const dlat = utils.deg2rad(lat1 - lat0);
      const dlng = utils.deg2rad(lng1 - lng1);
      const lat_mid = utils.deg2rad((lat0 + lat1) / 2);
      const {M, N} = utils.getMN(lat_mid);
      return Math.sqrt( Math.pow(M * dlat, 2) + Math.pow(N * dlng * Math.cos(lat_mid), 2));
    }
  }
  
  const area =  (()=>{
    const circle = L.circle(def_center, {radius:50 * 1000});
    let show_circle = false;
    function get_random_point(ll,radius){
      const angle = Math.random() * 2 * Math.PI; //radian
      const dist = Math.random() * radius; //km
      const lat_rad = utils.deg2rad(ll[0]); //radian
      const lng_rad = utils.deg2rad(ll[1]); //radian

      const {M, N} = utils.getMN(lat_rad);

      const dlat = dist * Math.cos(angle) / M; //radian
      const dlng = dist * Math.sin(angle) / (N * Math.cos(lat_rad)); //radian
      
      const lat2 = utils.rad2deg(lat_rad + dlat);
      const lng2 = utils.rad2deg(lng_rad + dlng);
      return [lat2, lng2]
    }
    return {
      open(){
        if(!show_circle){
          circle.setLatLng(the_map.getCenter());
          circle.addTo(the_map);
          show_circle = true;
        }
      },
      close(){
        if(show_circle){
          circle.remove();
          show_circle = false;
        }
      },
      reopen(){
        circle.setLatLng(the_map.getCenter());
      },
      setRadius(radius = 50){
        circle.setRadius(radius * 1000);
      },
      random(radius = 50){
        const ll = circle.getLatLng();
        const new_ll = get_random_point([ll.lat,ll.lng], radius);
        return Promise.resolve(new_ll);
      }
    }
  })();

  class Region{
    constructor({
      name="",
      filename="",
      urlbase="./", 
      range=[[0,0],[0,0]],
      code=0
    }){
      this.name = name;
      this.filename = filename;
      this.urlbase = urlbase;
      this.range = range;
      this.code = code;
      this.loaded = false;
      this.features = [];
      this.meta = {};
    }
    async load(){
      if(this.loaded) return this.features;
      const url = this.urlbase + this.filename;
      const features = [];
      await fetch(url).then(async resp=>{
        for await (let feature of flatgeobuf.deserialize(resp.body, undefined, meta=>{this.meta=meta})){
          features.push(feature);
        }
        this.features = features;
        this.loaded = true;
      })
      return features;
    }
    async random(){
      await this.load();
      const random_point = range=>range.map(r=>{
        const rr = [Math.min(...r),Math.max(...r)];
        return rr[0] + Math.random()*(rr[1]-rr[0]);
      });
      const range = this.range;
      let latlng;
      let count=0;
      while(true){
        count++;
        const ll = random_point(range);
        if(this.check_hit(ll)){
          latlng = ll;
          break;
        }
      }
      return latlng;
    }
    check_hit(latlng){
      return this.features.some(feature=>geo_pointPolygonIntersection(latlng,feature))
    }
  }

  const japan = (()=>{
    const region = new Region({
      name:"日本",
      filename:"japan_simple5b.fgb",
      urlbase:"./",
      range:[
        [20.419291, 45.548679],
        [122.931519, 153.995361]
      ]
    });
    return {
      async init(){
        const j = await region.load();
        return j;
      },
      async random(){
        return await region.random();
      }
    };
  })();

  const prefs = (()=>{
    const list_url = "./pref/list.json";
    const list = {};
    let list_loaded = false;
    return {
      async init(){
        if(list_loaded) return list;
        await fetch(list_url).then(resp=>resp.json()).then(json=>{
          for (let prefName in json){
            list[prefName] = new Region({
              name:prefName,
              urlbase:"./pref/",
              filename:json[prefName].filename,
              range:json[prefName].range,
              code:json[prefName].code
            });
          }
          list_loaded = true;
        })
        return list;
      },
      async load(pref){
        const p = await list[pref].load();
        return p;
      },
      async random(pref){
        return await list[pref].random();
      }
    }
  })();

  const history_layer = (()=>{
    const features = [];
    const layer_group = L.layerGroup();
    let alpinedelete = null;
    function init(history=[], show_layer=false, deletefunc){
      history.forEach(hist=>{
        add(hist.latlng, hist.placeName, hist.id);
      });
      if(show_layer){
        layer_group.addTo(the_map);
      }
      alpinedelete = deletefunc;
    }
    function add(latlng, placeName,id){
      const m = L.circleMarker(latlng, {
        radius:5,
        weight:1,
        color:"#fff",
        fillColor:"#f66",
        fillOpacity:1.0
      });
      const popup = create_popup({latlng, zoom:10, placeName, history:true, deletefunc:()=>{ remove_from_popup(id) }});
      m.bindPopup(popup);
      features.push({id, marker:m, popup});
      layer_group.addLayer(m);
    }
    function remove(id){
      const index = features.findIndex(f=>f.id==id);
      if(index != -1){
        const feature = features.splice(index, 1);
        layer_group.removeLayer(feature[0].marker);
      }
    }
    function remove_from_popup(id){
      alpinedelete(id);
      remove(id)
    }
    function show(){
      layer_group.addTo(the_map);
    }
    function hide(){
      layer_group.removeFrom(the_map);
    }
    function get_feature(id){
      return features.find(f=>f.id==id);
    }
    return {
      init,
      add,
      remove,
      show,
      hide,
      get_feature,
    }
  })();

  const geolocation = (()=>{
    let watching = false;
    let watch_id;
    let loading = false;
    let lat = 0;
    let lng = 0;
    const geo_marker = L.circleMarker(def_center,{
      radius:7,
      weight:2,
      color:"#fff",
      fillColor:"#66f",
      fillOpacity:1.0
    });
    let button_container, gps_button, mylocation_button;
    const buttons = L.Control.extend({
      options:{
        position:"bottomright"
      },
      onAdd(){
        button_container = L.DomUtil.create("div", "leaflet-bar leaflet-control");
        mylocation_button = L.DomUtil.create("a", "material-symbols-outlined geo-button geo-button-hidden",button_container);
        gps_button = L.DomUtil.create("a", "material-symbols-outlined geo-button",button_container);
        [gps_button,mylocation_button].forEach(elm=>{
          elm.addEventListener("mousedown", e=>e.stopPropagation());
          elm.addEventListener("click", e=>{
            e.stopPropagation();
            e.preventDefault();
          })
          elm.style.cssText = "font-size:24px;";
        });
        gps_button.innerText = `location_on`;
        gps_button.addEventListener("click",()=>{
          toggle_watch();
        });
        mylocation_button.innerText = `location_searching`;
        mylocation_button.addEventListener("click",()=>{
          moveto_mylocation();
        });
        return button_container;
      }
    });
    const geo_buttons = new buttons();
    the_map.addControl(geo_buttons);

    function toggle_watch(){
      if(!watching){
        start_watch();
      }
      else if(watch_id){
        clear_watch();
      }
    }
    function start_watch(){
      if(watching) return;
      loading = true;
      gps_button.classList.add("geo-button-loading");
      const id = navigator.geolocation.watchPosition(position=>{
        if(loading){
          gps_button.classList.remove("geo-button-loading");
          loading = false;
        }
        watching = true;
        gps_button.classList.add("geo-button-on");
        mylocation_button.classList.remove("geo-button-hidden");
        const c = position.coords;
        if(lat != c.latitude || lng != c.longitude){
          onmove_funcs.forEach(func=>{func([c.latitude, c.longitude],[lat, lng])})
        }
        lat = c.latitude;
        lng = c.longitude;
        geo_marker.addTo(the_map)
        geo_marker.setLatLng([c.latitude,c.longitude]);
        //console.log("watch",this.lat,this.lng,c.accuracy);
      }, err=>{
        if(loading){
          gps_button.classList.remove("geo-button-loading");
          loading = false;
        }
        console.error(err);
      }, {enableHighAccuracy:true});
      watch_id = id;
    }
    function clear_watch(){
      if(!watching) return;
      navigator.geolocation.clearWatch(watch_id);
      gps_button.classList.remove("geo-button-on");
      mylocation_button.classList.add("geo-button-hidden");
      geo_marker.remove();
      watching = false;
      watch_id = null;
    }
    function get_once(moveto_location=false){
      return new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(position=>{
          const c = position.coords;
          lat = c.latitude, lng = c.longitude;
          geo_marker.addTo(the_map);
          geo_marker.setLatLng([c.latitude,c.longitude]);
          if(moveto_location) the_map.panTo([c.latitude,c.longitude]);
          //console.log("get",lat,lng,c.accuracy);
          resolve([c.latitude,c.longitude]);
        },err=>{
          reject(err);
        })
      })
    }
    function moveto_mylocation(){
      if(watching){
        the_map.panTo([lat,lng])
      }
    }
    const onmove_funcs = [];
    function onmove(func){
      if(func && typeof func == "function"){
        onmove_funcs.push(func);
      }
    }
    function is_watching(){
      return watching;
    }
    return {
      toggle_watch,
      start_watch,
      clear_watch,
      get_once,
      moveto_mylocation,
      onmove,
      is_watching
    }

  })();

  const captureimage = (()=>{
    async function captureimage(map, title_text = "日本列島をダーツで旅するやつ", place_text = "熊本県八代市郡築十一番町に、行ってらっしゃい", latlng){
      const mapelm = map.getContainer();

      const target_width = 540;
      const target_height = 720;

      const current_width = mapelm.clientWidth;
      const current_height = mapelm.clientHeight;
      const dx = Math.round((target_width - current_width)/2);
      const dy = Math.round((target_height - current_height)/2);

      mapelm.querySelectorAll(".dart-share_urls, .popup-console").forEach(el=>{
        el.style.display = "none";
      })
      let canvas = await domtoimage.toCanvas(mapelm, {
        cacheBust: true,
        width:target_width,
        height:target_height,
        pixelRatio: window.devicePixelRatio || 1,
        bgcolor: null,
        loadExternalStyleSheet:true,
        adjustClonedNode: (node,clone,after)=>{
          if(node.classList && node.classList.contains("leaflet-map-pane")){
            clone.style.translate = `${dx}px ${dy}px`;
          }
        },
        filter: (node) => {
          if (node.classList && (
              node.classList.contains('leaflet-control-container')
              || node.classList.contains("dart-share_urls")
              || node.classList.contains("popup-console")
            )) {
            return false;
          }
          else if(node.src){
            if(/data:image\/png;base64,iVBORw0KGgoAAAANSUhEUgAAACMAAAA/.exec(node.src)){
              return false; //leaflet.centercross
            }
          }
          return true;
        }
      })
      mapelm.querySelectorAll(".dart-share_urls, .popup-console").forEach(el=>{
        el.style.display = "block";
      })
      canvas = cropAndResize(canvas, target_width, target_height-24-18-18);
      canvas = appendBanner(canvas, target_width, target_height, title_text, 24, place_text, 20, latlng, 18);      
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `darts-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png'); 
    }
    function cropAndResize(canvas, targetWidth = 720, targetHeight = 960) {
      const targetRatio = targetWidth / targetHeight; 
      const srcRatio = canvas.width / canvas.height;

      let cropWidth, cropHeight;
      if (srcRatio > targetRatio) { // 元画像が横長すぎる → 高さ基準でクロップ幅を決める
        cropHeight = canvas.height;
        cropWidth = cropHeight * targetRatio;
      } else { // 元画像が縦長すぎる(または一致) → 幅基準でクロップ高さを決める
        cropWidth = canvas.width;
        cropHeight = cropWidth / targetRatio;
      }

      const sx = (canvas.width - cropWidth) / 2;
      const sy = (canvas.height - cropHeight) / 2;

      const outCanvas = document.createElement('canvas');
      outCanvas.width = targetWidth;
      outCanvas.height = targetHeight;

      const ctx = outCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      ctx.drawImage(
        canvas,
        sx, sy, cropWidth, cropHeight, // 元画像からの切り取り範囲
        0, 0, targetWidth, targetHeight // 出力先へのリサイズ描画
      );
      return outCanvas;
    }

    function appendBanner(canvas, width=720, height=960, bannerText="", bannerHeight=24, subBannerText="", subBannerHeight=16, latlng, subBannerHeight2=16){
      const newCanvas = document.createElement("canvas");
      newCanvas.width = width;
      newCanvas.height = height;
      if(!subBannerText){
        subBannerHeight = 0;
      }
      if(!latlng){
        subBannerHeight2 = 0;
      }
      const context = newCanvas.getContext("2d");
      context.fillStyle = "#a00";
      context.fillRect(0, 0, width, bannerHeight+subBannerHeight+subBannerHeight2);
      
      context.fillStyle = "#fff";
      context.textAlign = "center";
      context.font = `bold ${Math.round(bannerHeight * 0.8)}px serif`;
      context.fillText(bannerText, width/2, Math.round(bannerHeight * 0.8), width);

      if(subBannerText){
        context.strokeStyle ="#fff";
        const lineLength = Math.round(width * 0.3);
        context.moveTo((width-lineLength)/2, bannerHeight);
        context.lineTo((width-lineLength)/2+lineLength, bannerHeight);
      //  context.stroke();
        context.font = `${Math.round(subBannerHeight * 0.9)-3}px serif`;
        context.fillText(subBannerText, width/2, bannerHeight + Math.round(subBannerHeight * 0.9)-3, width);
      }
      if(latlng){
        context.font = `${Math.round(subBannerHeight2 * 0.9)-3}px serif`;
        context.fillText(`（緯度:${latlng[0].toFixed(6)}, 経度:${latlng[1].toFixed(6)}）`, width/2, bannerHeight + subBannerHeight + Math.round(subBannerHeight2 * 0.9)-3, width);
      }

      context.drawImage(canvas, 0, bannerHeight+subBannerHeight+subBannerHeight2);

      const contribution = "©Openstreetmap Contributors";
      context.font = "12px sans-serif";
      context.textAlign = "left";
      const text_width = context.measureText(contribution).width;

      context.fillStyle = "#fff";
      context.fillRect(width-text_width-2,height-16,text_width+2,16);
      context.fillStyle = "#333";
      context.fillText(contribution, width-text_width-2, height-4);

      return newCanvas;
    }
    return captureimage;
  })()

  return {
    put_marker,
    area,
    japan,
    prefs,
    geolocation,
    history_layer
  }
})();

document.addEventListener("alpine:init", ()=>{
  Alpine.data("dart", ()=>({
    mode:"japan",
    area_radius:50,
    prefecture:"北海道",
    pref_list:{},
    history:[],
    mode_change(){
      if(this.mode=="area"){
        dart.area.open();
      }
      else{
        dart.area.close();
      }
    },
    async load_pref_list(){
      const list = await dart.prefs.init();
      this.pref_list = Object.values(list).sort((a,b)=>a.code - b.code);
      dart.prefs.load(this.pref_list[0].name);
    },
    async throw_dart(){
      if(this.mode=="japan"){
        const ll = await dart.japan.random();
        const obj = await dart.put_marker(ll);
        this.add_history({mode:"japan", ...obj});
      }
      if(this.mode=="prefecture"){
        const ll = await dart.prefs.random(this.prefecture);
        const obj = await dart.put_marker(ll);
        this.add_history({mode:"prefecture", ...obj});
      }
      if(this.mode=="area"){
        const ll = await dart.area.random(this.area_radius);
        const obj = await dart.put_marker(ll);
        this.add_history({mode:"area", ...obj});
      }
    },
    history_count:0,
    add_history({mode, latlng, placeName}){
      const id = this.history_count++
      this.history.unshift({mode, latlng, placeName, time:Date.now(), id});
      this.save_history();
      dart.history_layer.add(latlng, placeName, id)
    },
    restore_history(i){
      const hist = this.history[i];
      dart.put_marker(hist.latlng);
    },
    delete_history(i){
      const id = this.history[i].id;
      //console.log(id);
      this.history.splice(i,1);
      dart.history_layer.remove(id);
      this.save_history();
    },
    delete_history_byid(id){
      const i = this.history.findIndex(h=>h.id==id);
      if(i != -1){
        this.delete_history(i);
      }
    },
    save_history(){
      localStorage.setItem("dart_history", JSON.stringify(this.history));
    },
    load_history(){
      if(localStorage.getItem("dart_history")){
        this.history = JSON.parse(localStorage.getItem("dart_history"));
        for (let i=0; i < this.history.length; i++){
          this.history[i].id = this.history_count++;
        }
      }
      dart.history_layer.init(this.history,false,(id)=>{this.delete_history_byid(id)});
    },
    clear_history(){
      if(confirm("履歴を全て削除しますか?")){
        this.history.length = 0;
      }      
    },
    show_history_layer:false,
    toggle_history_layer(){
      if(this.show_history_layer){
        dart.history_layer.show();
      }
      else{
        dart.history_layer.hide();
      }
    },
    create_history_CSV(){
      const column_separator = ",";
      const row_separator = "\r\n";
      const header = ["no","mode","placeName","latitude","longtitude", "timestamp"];
      const csv = [header.join(column_separator)];
      this.history.forEach((hist,index)=>{
        const row = [index, hist["mode"], hist["placeName"], hist["latlng"][0], hist["latlng"][1], hist["time"]].map(v=>{
          if(v.toString().indexOf(column_separator)!=-1){
            return `"${v.toString()}"`;
          }
          return v.toString();
        });
        csv.push(row.join(column_separator));
      });
      return csv.join(row_separator);
    },
    create_history_txt(){
      return this.history.map(hist=>hist.latlng.join(",")).join("\r\n");
    },
    create_history_geoJSON(){
      const root = {type:"FeatureCollection",features:[]};
      this.history.forEach(hist=>{
        root.features.push({
          type:"Feature",
          geometry:{
            type:"Point",
            coordinates:[hist.latlng[1],hist.latlng[0]]
          },
          properties:{
            name:hist.placeName
          }
        });
      })
      return JSON.stringify(root);
    },
    create_history_KML(){
      const placemarks = this.history.map(hist=>{
        return `
<Placemark>
  <name>${hist.placeName}</name>
  <description>${hist.placeName}</description>
  <Point>
    <coordinates>${hist.latlng[1]},${hist.latlng[0]}</coordinates>
  </Point>
</Placemark>`;
      });
      return `
<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
${placemarks.join("\r\n")}
  </Document>
</kml>`
    },
    export_history(mode){
      let text = "{}", mime = "application/json", fileext = ".json";
      if(mode=="CSV"){
        text = this.create_history_CSV();
        mime = "text/csv";
        fileext = ".csv";
      }
      else if(mode=="list-txt"){
        text = this.create_history_txt();
        mime = "text/plain";
        fileext = ".txt";
      }
      else if(mode=="geoJSON"){
        text = this.create_history_geoJSON();
        mime = "application/json";
        fileext = ".geojson";
      }
      else if(mode=="KML"){
        text = this.create_history_KML();
        mime="application/vnd.google-earth.kml+xml";
        fileext = ".kml";
      }
      const blob = new Blob([text], {type:mime});
      const objecturl = URL.createObjectURL(blob);
      const link = this.$refs.dl_link;
      link.href = objecturl;
      link.download = `dart-${Date.now()}${fileext}`;
      link.click();
    },
    async load_point(){
      if(location.search){
        const params = new URLSearchParams(location.search);
        let ll = params.get("ll");
        history.replaceState(null,"",location.origin + location.pathname);
        if(ll){
          ll = decodeURIComponent(ll);
          const match = ll.match(/^(\d+(?:\.\d+)?),(\d+(?:\.\d+)?)$/);
          if(match){
            const lat = parseFloat(match[1]);
            const lng = parseFloat(match[2]);
            const obj = await dart.put_marker([lat,lng]);
            this.add_history({mode:"url", ...obj});
          }
        }
      }
    },
    init(){
      this.load_history();
      this.load_point();
    }
  }))
})
